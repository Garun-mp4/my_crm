name: my-crm

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "25m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    logging: *default-logging
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: default
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d default"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    logging: *default-logging
    stop_grace_period: 30s
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  db-init:
    image: my-crm-server:latest
    logging: *default-logging
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: packages/twenty-docker/twenty/Dockerfile
      target: twenty-server
    env_file:
      - path: packages/twenty-server/.env
        required: true
    environment:
      PG_DATABASE_URL: postgres://postgres:postgres@postgres:5432/default
      REDIS_URL: redis://redis:6379
      NODE_PORT: "3000"
      SERVER_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3001
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      PERSISTENT_DB_INIT: "true"
      SEED_DEV_ON_EMPTY: ${SEED_DEV_ON_EMPTY:-true}
    command:
      [
        "sh",
        "-c",
        "sh /app/scripts/crm-db-init.sh && touch /tmp/crm-db-init-ready && exec tail -f /dev/null",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/crm-db-init-ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  server:
    image: my-crm-server:latest
    logging: *default-logging
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: packages/twenty-docker/twenty/Dockerfile
      target: twenty-server
    env_file:
      - path: packages/twenty-server/.env
        required: true
    environment:
      PG_DATABASE_URL: postgres://postgres:postgres@postgres:5432/default
      REDIS_URL: redis://redis:6379
      NODE_PORT: "3000"
      SERVER_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3001
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      APPLICATION_LOG_DRIVER: CONSOLE
    volumes:
      - ./packages/twenty-server/.local-storage:/app/packages/twenty-server/.local-storage
    ports:
      - "3000:3000"
    depends_on:
      db-init:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  worker:
    image: my-crm-server:latest
    logging: *default-logging
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: packages/twenty-docker/twenty/Dockerfile
      target: twenty-server
    env_file:
      - path: packages/twenty-server/.env
        required: true
    environment:
      PG_DATABASE_URL: postgres://postgres:postgres@postgres:5432/default
      REDIS_URL: redis://redis:6379
      NODE_PORT: "3000"
      SERVER_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3001
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      APPLICATION_LOG_DRIVER: CONSOLE
    command: ["node", "dist/queue-worker/queue-worker"]
    volumes:
      - ./packages/twenty-server/.local-storage:/app/packages/twenty-server/.local-storage
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  my-crm-sync:
    image: my-crm-sync:latest
    logging: *default-logging
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: packages/twenty-docker/twenty/Dockerfile
      target: my-crm-sync
    # The SDK receives local file-upload URLs from the server. Sharing the
    # server network namespace makes localhost:3000 resolve to the server
    # container during the one-shot sync, while keeping the public SERVER_URL
    # correct for the browser.
    network_mode: service:server
    environment:
      TWENTY_SERVER_URL: http://localhost:3000
      TWENTY_SYNC_ORIGIN: http://localhost:3001
      TWENTY_SYNC_EMAIL: ${TWENTY_SYNC_EMAIL:-tim@apple.dev}
      TWENTY_SYNC_PASSWORD: ${TWENTY_SYNC_PASSWORD:-tim@apple.dev}
    volumes:
      # Keep the one-shot sync on the current checked-out app source even when
      # the existing image predates a source-only change. A rebuild still
      # produces a self-contained image for clean machines.
      - ./packages/twenty-apps/internal/my-crm/src:/app/packages/twenty-apps/internal/my-crm/src:ro
      - ./packages/twenty-apps/internal/my-crm/locales:/app/packages/twenty-apps/internal/my-crm/locales:ro
      - ./packages/twenty-docker/scripts/sync-my-crm.mjs:/app/scripts/sync-my-crm.mjs:ro
      - ./packages/twenty-docker/scripts/run-lead-tracker-sync.mjs:/app/scripts/run-lead-tracker-sync.mjs:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/my-crm-sync-ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  front:
    image: my-crm-front:latest
    logging: *default-logging
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: packages/twenty-docker/twenty/Dockerfile
      target: twenty-front
      args:
        FRONTEND_SERVER_URL: ${FRONTEND_SERVER_URL:-http://localhost:3000}
    ports:
      - "3001:80"
    volumes:
      # Keep the proxy configuration in the repository and apply it without
      # requiring a frontend dependency rebuild for ordinary local changes.
      - ./packages/twenty-docker/twenty/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      my-crm-sync:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  # This is the existing local development database volume. Keeping its name
  # preserves the current workspace and makes the migration non-destructive.
  db-data:
    external: true
    name: twenty-dev_dev-db-data
  redis-data:
    name: my-crm_redis-data
