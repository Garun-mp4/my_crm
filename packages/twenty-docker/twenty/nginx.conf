server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Keep the browser on the public frontend origin while forwarding the
  # API endpoints to the backend container. This also makes the stack work
  # with the static frontend build's same-origin fallback configuration.
  location ~ ^/(metadata|graphql|admin-panel|client-config|rest(?:/|$)|file(?:/|$)|auth(?:/|$)|webhooks(?:/|$)|s(?:/|$)|mcp(?:/|$)|open-api(?:/|$)) {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
